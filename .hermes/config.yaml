model:
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex
  default: gpt-5.6-sol
terminal:
  cwd: .
security:
  redact_secrets: true
_config_version: 33
mcp_servers:
  parallel_search:
    url: https://search.parallel.ai/mcp
    enabled: true

skills:
